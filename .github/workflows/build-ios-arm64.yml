name: Build iOS arm64 (MetalFX)

on:
  workflow_dispatch:
    inputs:
      apply_metal_patch:
        description: Validate Metal-Patch compatibility (legacy option)
        required: true
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - 'Metal-Patch'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'ios/**'
      - 'glue/**'
      - 'LibertyRecomp/**'
      - 'LibertyRecompLib/**'
      - '.github/workflows/build-ios-arm64.yml'

permissions:
  contents: read

env:
  BUILD_PRESET: theft4-device-release
  CONFIGURE_PRESET: ios-device-release

jobs:
  build:
    name: Build unsigned iOS arm64 app
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select modern Xcode and inspect SDK
        shell: bash
        run: |
          set -euo pipefail
          xcode_app="$(find /Applications -maxdepth 1 -type d -name 'Xcode_16*.app' | sort -V | tail -n 1)"
          if [[ -z "$xcode_app" ]]; then
            xcode_app="$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' | sort -V | tail -n 1)"
          fi
          [[ -n "$xcode_app" ]] || { echo 'No Xcode installation found.' >&2; exit 1; }
          sudo xcode-select -s "$xcode_app/Contents/Developer"
          echo "DEVELOPER_DIR=$xcode_app/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install CMake, Ninja, and LLVM 18+
        shell: bash
        run: |
          set -euo pipefail
          brew install cmake ninja llvm
          llvm_prefix="$(brew --prefix llvm)"
          echo "LLVM_PREFIX=$llvm_prefix" >> "$GITHUB_ENV"
          echo "$llvm_prefix/bin" >> "$GITHUB_PATH"
          "$llvm_prefix/bin/clang" --version
          "$llvm_prefix/bin/clang++" --version
          clang_major="$($llvm_prefix/bin/clang -dumpversion | cut -d. -f1)"
          [[ "$clang_major" -ge 18 ]] || { echo "Homebrew LLVM must be 18 or newer; found $clang_major." >&2; exit 1; }
          cmake --version
          ninja --version

      - name: Verify committed iOS bridge configuration
        shell: bash
        run: |
          set -euo pipefail
          test -f ios/CMakeLists.txt
          grep -F 'add_library(theft4_core_bridge STATIC' ios/CMakeLists.txt
          grep -F 'bridge/theft4_metal_presenter.mm' ios/CMakeLists.txt
          grep -F 'bridge/theft4_native_profile_stub.cpp' ios/CMakeLists.txt
          test -f ios/bridge/theft4_metal_presenter.mm
          test -f ios/bridge/theft4_native_profile_stub.cpp

      - name: Check legacy Metal patch status
        if: ${{ inputs.apply_metal_patch == true }}
        shell: bash
        run: |
          set -euo pipefail
          # Metal-Patch is a historical aggregate diff. Its hunks target older
          # source revisions and cannot safely be applied over the committed
          # iOS configuration. Never mutate the checkout in CI.
          if git apply --reverse --check Metal-Patch >/dev/null 2>&1; then
            echo 'Metal-Patch changes are already present.'
          elif git apply --check Metal-Patch >/dev/null 2>&1; then
            echo 'Metal-Patch is compatible, but is intentionally not applied; committed sources are authoritative.'
          else
            echo 'Metal-Patch is stale/incompatible with the current tree; continuing with committed sources.'
          fi

      - name: Configure iOS arm64 Release without embedded game files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out/build/ios-device-release
          export CC="$LLVM_PREFIX/bin/clang"
          export CXX="$LLVM_PREFIX/bin/clang++"
          cmake --preset "$CONFIGURE_PRESET" \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_C_EXTENSIONS=OFF \
            -DCMAKE_CXX_EXTENSIONS=OFF \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DLIBERTY_RECOMP_IOS_CORE_ONLY=ON

      - name: Confirm generated Theft4 target
        shell: bash
        run: |
          set -euo pipefail
          project=out/build/ios-device-release/LibertyRecomp-ALL.xcodeproj
          xcodebuild -project "$project" -list | tee "$RUNNER_TEMP/xcode-targets.txt"
          grep -E '^\s+Theft4$' "$RUNNER_TEMP/xcode-targets.txt"

      - name: Compile Theft4
        run: cmake --build --preset "$BUILD_PRESET" --parallel "$(sysctl -n hw.logicalcpu)"

      - name: Verify arm64 app bundle
        shell: bash
        run: |
          set -euo pipefail
          app="out/build/ios-device-release/Release/Theft4.app"
          [[ -d "$app" ]] || { echo "Expected app not found: $app" >&2; find out/build -maxdepth 4 -name '*.app' -print; exit 1; }
          file "$app/Theft4" || true
          lipo -info "$app/Theft4"
          lipo -archs "$app/Theft4" | grep -qw arm64
          plutil -p "$app/Info.plist" || true

      - name: Package unsigned app
        run: ditto -c -k --sequesterRsrc --keepParent 'out/build/ios-device-release/Release/Theft4.app' 'Theft4-metal-ios-arm64-unsigned.zip'

      - name: Upload iOS arm64 app
        uses: actions/upload-artifact@v4
        with:
          name: Theft4-metal-ios-arm64-unsigned
          path: Theft4-metal-ios-arm64-unsigned.zip
          if-no-files-found: error
          retention-days: 14
