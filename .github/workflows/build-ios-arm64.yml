name: Build iOS arm64 (MetalFX)

on:
  workflow_dispatch:
    inputs:
      apply_metal_patch:
        description: Apply Metal-Patch when it is not already present
        required: true
        default: true
        type: boolean
  push:
    branches: [main]
    paths:
      - 'Metal-Patch'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'ios/**'
      - 'glue/**'
      - 'LibertyRecomp/**'
      - 'LibertyRecompLib/**'
      - '.github/workflows/build-ios-arm64.yml'

permissions:
  contents: read

env:
  BUILD_PRESET: theft4-device-release
  CONFIGURE_PRESET: ios-device-release
  IOS_CMAKELISTS_BASE: 7502715cf155ff465be0f56c0637d6f02c13ab91

jobs:
  build:
    name: Build unsigned iOS arm64 app
    runs-on: macos-14
    timeout-minutes: 120

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode and inspect SDK
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install CMake, Ninja, and LLVM 18+
        shell: bash
        run: |
          set -euo pipefail
          brew install cmake ninja llvm
          llvm_prefix="$(brew --prefix llvm)"
          echo "LLVM_PREFIX=$llvm_prefix" >> "$GITHUB_ENV"
          echo "$llvm_prefix/bin" >> "$GITHUB_PATH"
          "$llvm_prefix/bin/clang" --version
          "$llvm_prefix/bin/clang++" --version
          clang_major="$($llvm_prefix/bin/clang -dumpversion | cut -d. -f1)"
          if [[ "$clang_major" -lt 18 ]]; then
            echo "Homebrew LLVM must be 18 or newer; found $clang_major." >&2
            exit 1
          fi
          cmake --version
          ninja --version

      - name: Restore complete iOS CMake project and guard optional runtime
        shell: bash
        run: |
          set -euo pipefail
          # ios/CMakeLists.txt was accidentally truncated in an earlier commit.
          # Restore the known-good complete file before configuring the project.
          git show "$IOS_CMAKELISTS_BASE:ios/CMakeLists.txt" > ios/CMakeLists.txt
          python3 - <<'PY'
          from pathlib import Path
          p = Path("ios/CMakeLists.txt")
          text = p.read_text()
          old = "    target_compile_definitions(rexruntime PRIVATE THEFT4_LAB_BUILD=1)"
          new = "    if(TARGET rexruntime)\n        target_compile_definitions(rexruntime PRIVATE THEFT4_LAB_BUILD=1)\n    endif()"
          if old not in text:
              raise SystemExit("Expected rexruntime definition was not found")
          p.write_text(text.replace(old, new, 1))
          PY
          grep -A5 -B2 'TARGET rexruntime' ios/CMakeLists.txt

      - name: Apply or verify Metal patch
        if: ${{ inputs.apply_metal_patch != false }}
        shell: bash
        run: |
          set -euo pipefail
          if git apply --check Metal-Patch; then
            git apply --index Metal-Patch
            echo 'Metal-Patch applied.'
          elif git apply --reverse --check Metal-Patch; then
            echo 'Metal-Patch is already applied; continuing.'
          else
            echo 'Metal-Patch is neither applicable nor already applied.' >&2
            exit 1
          fi

      - name: Configure iOS arm64 Release without embedded game files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out/build/ios-device-release
          export CC="$LLVM_PREFIX/bin/clang"
          export CXX="$LLVM_PREFIX/bin/clang++"
          cmake --preset "$CONFIGURE_PRESET" \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DLIBERTY_RECOMP_IOS_CORE_ONLY=ON

      - name: Confirm generated Theft4 target
        shell: bash
        run: |
          set -euo pipefail
          project=out/build/ios-device-release/LibertyRecomp-ALL.xcodeproj
          xcodebuild -project "$project" -list | tee "$RUNNER_TEMP/xcode-targets.txt"
          grep -E '^\s+Theft4$' "$RUNNER_TEMP/xcode-targets.txt"

      - name: Compile Theft4
        run: cmake --build --preset "$BUILD_PRESET" --parallel "$(sysctl -n hw.logicalcpu)"

      - name: Verify arm64 app bundle
        shell: bash
        run: |
          set -euo pipefail
          app="out/build/ios-device-release/Release/Theft4.app"
          [[ -d "$app" ]] || { echo "Expected app not found: $app" >&2; find out/build -maxdepth 4 -name '*.app' -print; exit 1; }
          file "$app/Theft4" || true
          lipo -info "$app/Theft4"
          lipo -archs "$app/Theft4" | grep -qw arm64
          plutil -p "$app/Info.plist" || true

      - name: Package unsigned app
        run: ditto -c -k --sequesterRsrc --keepParent 'out/build/ios-device-release/Release/Theft4.app' 'Theft4-metal-ios-arm64-unsigned.zip'

      - name: Upload iOS arm64 app
        uses: actions/upload-artifact@v4
        with:
          name: Theft4-metal-ios-arm64-unsigned
          path: Theft4-metal-ios-arm64-unsigned.zip
          if-no-files-found: error
          retention-days: 14
